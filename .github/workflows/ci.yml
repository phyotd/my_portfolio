steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: 'npm'

  - name: Install dependencies
    run: npm ci

  - name: Run ESlint
    run: npm run lint

  - name: Check TypeScript
    run: npx tsc --noEmit

  - name: Run tests
    run: npm test

  - name: Build Next.js Application
    run: npm run build
